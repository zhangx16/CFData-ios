name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, ios-unsigned]
    paths:
      - 'ios/**'
      - 'combined_refactor/**'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MOBILE_VERSION: v0.0.0-20261011034528-197770444867
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: combined_refactor/go.mod
          cache-dependency-path: combined_refactor/go.sum
      - name: Install build tools
        run: |
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gomobile@"$MOBILE_VERSION"
          go install golang.org/x/mobile/cmd/gobind@"$MOBILE_VERSION"
          gomobile init
      - name: Build unsigned IPA
        run: bash ios/scripts/build_unsigned.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: CFData-ios-unsigned
          path: |
            release_assets/CFData-ios-unsigned.ipa
            release_assets/CFData-ios-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-diagnostics
          path: build/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish IPA to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ios-build-${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
      SOURCE_SHA: ${{ github.sha }}
      BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download compiled IPA
        uses: actions/download-artifact@v6
        with:
          name: CFData-ios-unsigned
          path: release_assets
      - name: Verify checksum
        working-directory: release_assets
        run: sha256sum --check CFData-ios-unsigned.ipa.sha256
      - name: Publish release assets
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          iOS/iPadOS 16.0+ ARM64 真机版，未签名，安装前需自行签名。

          源码提交：$SOURCE_SHA
          构建记录：$BUILD_URL

          下载 CFData-ios-unsigned.ipa；同目录提供 SHA-256 校验文件。
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release_assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release_assets/* \
              --target "$SOURCE_SHA" \
              --title "iOS 未签名 IPA · Build $BUILD_NUMBER" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
